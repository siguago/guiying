[package]
name = "guiying-volume"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
description = "Read-only, fail-closed volume identity and lossless path semantics for Guiying"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/siguago/guiying"
publish = false

[dependencies]
base64 = "=0.23.1"
# 不启用 "pure"：BLAKE3 输出与实现无关，默认 SIMD/NEON 路径换取大文件哈希吞吐。
blake3 = "=1.5.5"
getrandom = "=0.3.4"
serde = { version = "=1.0.229", features = ["derive"] }
thiserror = "=2.0.20"

[target.'cfg(target_os = "macos")'.dependencies]
libc = { version = "=0.2.189", features = ["extra_traits"] }
rustix = { version = "=1.1.4", features = ["fs"] }

[dev-dependencies]
serde_json = "=1.0.151"
tempfile = "=3.15.0"
